version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: python_quest_db
    restart: always
    environment:
      POSTGRES_USER: python_quest
      POSTGRES_PASSWORD: cyber_password_2025
      POSTGRES_DB: python_quest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: python_quest_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: python_quest_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://python_quest:cyber_password_2025@db:5432/python_quest_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=cyber-secret-change-in-production
      - COPILOT_API_KEY=${COPILOT_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: python_quest_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
